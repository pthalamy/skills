name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills and plugin manifests
        run: python3 scripts/validate_skills.py
      - name: Validate the skill template
        run: python3 scripts/validate_skills.py --path templates --skip-manifests
